server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:15432/webblock_auth
    username: webblock
    password: webblock123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-service checks every JWT against Keycloak's public key (fetched from this issuer)
          issuer-uri: http://localhost:8080/realms/webblock

management:
  endpoints:
    web:
      exposure:
        include: health

# Our own settings (not Spring's). Read with @Value in the code.
app:
  mail:
    from: no-reply@webblock.local
  otp:
    expire-minutes: 5          # the 6-digit code is good for 5 minutes
    max-attempts: 5            # after 5 wrong tries the user must click Resend
    token-expire-minutes: 15   # the verificationToken is good for 15 minutes
    pepper: webblock-otp-pepper-dev   # secret mixed into the hash; change in production
  keycloak:
    base-url: http://localhost:8080
    realm: webblock
    client-id: webblock-auth-service
    client-secret: webblock-auth-secret-dev   # same as in keycloak/realm-export.json
  google:
    # Where Keycloak sends the browser back after Google login = a PAGE in the frontend.
    # Must be allowed in the Keycloak client's "Valid redirect URIs".
    redirect-uri: http://localhost:3000/auth/google/callback
  cors:
    # Websites allowed to call this API from a browser (comma separated)
    allowed-origins: http://localhost:3000
